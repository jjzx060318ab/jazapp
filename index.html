<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FF6A88">
<title>家相册 · 我们的一家人</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%23FF6A88'/%3E%3Cpath d='M5.5 8.5h2.2l1.3-1.8h5l1.3 1.8h2.2a2 2 0 0 1 2 2v7a2 2 0 0 1-2 2h-12a2 2 0 0 1-2-2v-7a2 2 0 0 1 2-2z' fill='%23fff'/%3E%3Ccircle cx='12' cy='13.5' r='3.2' fill='none' stroke='%23FF6A88' stroke-width='1.6'/%3E%3C/svg%3E">
<link rel="stylesheet" href="https://miaoda.feishu.cn/fonts/css2?family=Noto+Sans+SC:wght@400;500;700;900&display=swap">
<style>
  :root{
    --bg:#FFF9F5;
    --card:#FFFFFF;
    --ink:#2D2A26;
    --ink-2:#8A7F76;
    --brand:#FF6A88;
    --brand-2:#FF9A5A;
    --line:#F2E7DE;
    --ok:#3FA06A;
    --danger:#D9534F;
    --radius:16px;
    --shadow:0 1px 2px rgba(45,42,38,.05);
    --shadow-lg:0 12px 32px rgba(45,42,38,.10);
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{
    font-family:'Noto Sans SC','PingFang SC','Microsoft YaHei',system-ui,-apple-system,sans-serif;
    background:var(--bg);color:var(--ink);font-size:15px;line-height:1.55;
    -webkit-font-smoothing:antialiased;
  }
  button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
  input{font-family:inherit}
  ::placeholder{color:#BDB2A8}
  .hidden{display:none!important}

  /* ===== 通用 ===== */
  .btn{
    display:inline-flex;align-items:center;justify-content:center;gap:8px;
    padding:12px 20px;border-radius:12px;font-size:15px;font-weight:700;
    transition:transform .12s ease,box-shadow .12s ease,background .12s ease;
    user-select:none;
  }
  .btn:active{transform:scale(.97)}
  .btn-primary{background:linear-gradient(135deg,var(--brand) 0%,var(--brand-2) 100%);color:#fff;box-shadow:0 6px 16px rgba(255,106,136,.32)}
  .btn-primary:hover{box-shadow:0 8px 22px rgba(255,106,136,.42)}
  .btn-ghost{background:var(--card);color:var(--ink);border:1px solid var(--line);box-shadow:var(--shadow)}
  .btn-ghost:hover{background:#FFF4EC}
  .btn-danger{background:#FDECEA;color:var(--danger)}
  .btn-block{width:100%}
  .btn[disabled]{opacity:.55;cursor:not-allowed;transform:none;box-shadow:none}

  .field{margin-bottom:16px}
  .field label{display:block;font-size:13px;font-weight:700;color:var(--ink-2);margin-bottom:7px}
  .input{
    width:100%;padding:13px 15px;border:1.5px solid var(--line);border-radius:12px;
    font-size:16px;background:#fff;color:var(--ink);outline:none;transition:border-color .15s,box-shadow .15s;
  }
  .input:focus{border-color:var(--brand);box-shadow:0 0 0 3px rgba(255,106,136,.14)}
  .input.err{border-color:var(--danger)}

  /* ===== 品牌区 ===== */
  .brand-row{display:flex;align-items:center;gap:12px;margin-bottom:6px}
  .brand-mark{width:44px;height:44px;flex:0 0 44px;border-radius:13px;background:linear-gradient(135deg,var(--brand),var(--brand-2));display:flex;align-items:center;justify-content:center;box-shadow:0 6px 16px rgba(255,106,136,.35)}
  .brand-mark svg{width:26px;height:26px}
  .brand-name{font-size:22px;font-weight:900;letter-spacing:.5px}
  .brand-sub{font-size:13px;color:var(--ink-2);margin-top:2px}

  /* ===== 登录页 ===== */
  #view-login{
    min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;
    padding:32px 24px;position:relative;overflow:hidden;
  }
  #view-login::before{
    content:"";position:absolute;top:-140px;right:-120px;width:380px;height:380px;border-radius:50%;
    background:radial-gradient(circle,rgba(255,106,136,.18),rgba(255,154,90,.05) 70%);
    pointer-events:none;
  }
  #view-login::after{
    content:"";position:absolute;bottom:-160px;left:-140px;width:360px;height:360px;border-radius:50%;
    background:radial-gradient(circle,rgba(255,154,90,.16),rgba(255,106,136,.04) 70%);
    pointer-events:none;
  }
  .login-card{
    width:100%;max-width:400px;background:var(--card);border:1px solid var(--line);
    border-radius:24px;padding:32px 26px;box-shadow:var(--shadow-lg);position:relative;z-index:1;
  }
  .login-tabs{display:flex;background:#FBF1EA;border-radius:12px;padding:4px;margin:22px 0 20px}
  .login-tabs button{flex:1;padding:9px 0;border-radius:9px;font-size:14px;font-weight:700;color:var(--ink-2);transition:all .15s}
  .login-tabs button.on{background:#fff;color:var(--ink);box-shadow:var(--shadow)}
  .form-foot{margin-top:4px;font-size:12.5px;color:var(--ink-2);text-align:center}
  .login-note{margin-top:18px;padding:11px 14px;background:#FFF6EC;border:1px solid #FFE3C7;border-radius:12px;font-size:12.5px;color:#A8763C;line-height:1.6}

  /* ===== 顶部栏 ===== */
  .topbar{
    position:sticky;top:0;z-index:20;background:rgba(255,249,245,.92);backdrop-filter:blur(8px);
    border-bottom:1px solid var(--line);padding:12px 18px;
    display:flex;align-items:center;gap:10px;max-width:900px;margin:0 auto;
  }
  .topbar .tb-title{display:flex;align-items:center;gap:9px;min-width:0;flex:1}
  .topbar .tb-name{font-size:17px;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .topbar .tb-code{font-size:11.5px;color:var(--ink-2);background:#fff;border:1px solid var(--line);padding:2px 8px;border-radius:20px;white-space:nowrap}
  .avatar-btn{
    width:38px;height:38px;border-radius:50%;background:linear-gradient(135deg,var(--brand),var(--brand-2));
    color:#fff;font-weight:900;font-size:15px;display:flex;align-items:center;justify-content:center;flex:0 0 38px;
  }
  .tb-actions{display:flex;align-items:center;gap:8px}
  .icon-btn{
    width:38px;height:38px;border-radius:11px;background:var(--card);border:1px solid var(--line);
    display:flex;align-items:center;justify-content:center;color:var(--ink);transition:all .15s;position:relative;
  }
  .icon-btn:hover{background:#FFF4EC;border-color:#FFD9C7}
  .icon-btn svg{width:19px;height:19px}
  .icon-btn.danger:hover{background:#FDECEA;color:var(--danger);border-color:#F6C7C3}

  /* 下拉菜单 */
  .menu-wrap{position:relative}
  .menu{
    position:absolute;right:0;top:46px;background:#fff;border:1px solid var(--line);border-radius:14px;
    box-shadow:var(--shadow-lg);min-width:190px;padding:6px;z-index:30;animation:pop .14s ease;
  }
  .menu button{display:flex;align-items:center;gap:10px;width:100%;padding:10px 12px;border-radius:9px;font-size:14px;text-align:left}
  .menu button:hover{background:#FFF4EC}
  .menu button svg{width:17px;height:17px;color:var(--ink-2);flex:0 0 17px}
  .menu .m-user{font-size:12.5px;color:var(--ink-2);padding:8px 12px 6px;border-bottom:1px solid var(--line);margin-bottom:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  @keyframes pop{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}

  /* ===== 欢迎页（创建/加入家族） ===== */
  .welcome-wrap{max-width:460px;margin:0 auto;padding:56px 22px 40px}
  .welcome-hero{text-align:center;margin-bottom:34px}
  .welcome-hero .big-icon{width:86px;height:86px;margin:0 auto 18px;border-radius:26px;background:linear-gradient(135deg,var(--brand),var(--brand-2));display:flex;align-items:center;justify-content:center;box-shadow:0 14px 30px rgba(255,106,136,.35)}
  .welcome-hero .big-icon svg{width:44px;height:44px}
  .welcome-hero h1{font-size:24px;font-weight:900;letter-spacing:.5px}
  .welcome-hero p{color:var(--ink-2);font-size:14px;margin-top:8px}
  .seg{display:flex;background:#FBF1EA;border-radius:13px;padding:4px;margin-bottom:24px}
  .seg button{flex:1;padding:11px 0;border-radius:10px;font-size:14px;font-weight:700;color:var(--ink-2)}
  .seg button.on{background:#fff;color:var(--ink);box-shadow:var(--shadow)}
  .welcome-card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:26px;box-shadow:var(--shadow-lg)}
  .code-hint{font-size:12.5px;color:var(--ink-2);text-align:center;margin-top:14px}
  .code-hint b{color:var(--brand);font-size:13px;letter-spacing:1px}

  /* ===== 相册 ===== */
  .album-wrap{max-width:900px;margin:0 auto;padding:18px 16px 90px}
  .album-head{display:flex;align-items:center;justify-content:space-between;margin:6px 2px 16px}
  .album-head .a-title{font-size:18px;font-weight:900}
  .album-head .a-count{font-size:13px;color:var(--ink-2);margin-top:2px}

  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:10px}
  .tile{
    position:relative;border-radius:13px;overflow:hidden;background:#F3EAE2;
    aspect-ratio:1;cursor:pointer;box-shadow:var(--shadow);
    transition:transform .14s ease,box-shadow .14s ease;
  }
  .tile:hover{transform:translateY(-2px);box-shadow:var(--shadow-lg)}
  .tile img,.tile video{width:100%;height:100%;object-fit:cover;display:block;background:#F3EAE2}
  .tile .tile-badge{
    position:absolute;left:8px;top:8px;background:rgba(45,42,38,.62);color:#fff;border-radius:8px;
    padding:3px 8px;font-size:11px;display:flex;align-items:center;gap:4px;backdrop-filter:blur(4px);
  }
  .tile .tile-badge svg{width:13px;height:13px}
  .tile .tile-info{
    position:absolute;left:0;right:0;bottom:0;padding:20px 9px 7px;color:#fff;font-size:11px;
    background:linear-gradient(to top,rgba(45,42,38,.72),transparent);display:flex;justify-content:space-between;gap:6px;
  }
  .tile .tile-info span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .tile .del-btn{
    position:absolute;right:7px;top:7px;width:27px;height:27px;border-radius:50%;
    background:rgba(45,42,38,.55);color:#fff;display:none;align-items:center;justify-content:center;z-index:2;
  }
  .tile .del-btn svg{width:14px;height:14px}
  .tile:hover .del-btn{display:flex}
  .tile .del-btn:hover{background:var(--danger)}

  /* 空态 */
  .empty{text-align:center;padding:70px 20px;color:var(--ink-2)}
  .empty svg{width:72px;height:72px;margin-bottom:16px;opacity:.85}
  .empty h3{font-size:18px;font-weight:900;color:var(--ink);margin-bottom:8px}
  .empty p{font-size:13.5px;line-height:1.7}

  /* 拖拽上传遮罩 */
  .drop-mask{
    position:fixed;inset:0;z-index:60;background:rgba(45,42,38,.45);display:flex;align-items:center;justify-content:center;
  }
  .drop-box{
    width:min(86vw,420px);padding:46px 28px;background:#fff;border-radius:22px;text-align:center;
    border:2px dashed var(--brand);
  }
  .drop-box svg{width:52px;height:52px;margin-bottom:14px}
  .drop-box h3{font-size:18px;font-weight:900}
  .drop-box p{font-size:13px;color:var(--ink-2);margin-top:6px}

  /* 上传进度 */
  .toast-wrap{position:fixed;left:50%;transform:translateX(-50%);bottom:26px;z-index:90;display:flex;flex-direction:column;gap:8px;align-items:center;width:min(92vw,420px)}
  .toast{
    background:rgba(45,42,38,.92);color:#fff;border-radius:12px;padding:11px 18px;font-size:13.5px;
    box-shadow:var(--shadow-lg);display:flex;align-items:center;gap:9px;max-width:100%;
    animation:pop .18s ease;
  }
  .toast.ok{background:rgba(63,160,106,.94)}
  .toast.err{background:rgba(217,83,79,.95)}
  .toast svg{width:16px;height:16px;flex:0 0 16px}
  .toast .bar{width:100%;height:4px;border-radius:2px;background:rgba(255,255,255,.25);overflow:hidden;margin-top:2px}
  .toast .bar i{display:block;height:100%;background:#fff;border-radius:2px;transition:width .15s}

  /* 大图查看 */
  .lightbox{
    position:fixed;inset:0;z-index:80;background:rgba(20,18,16,.92);display:flex;align-items:center;justify-content:center;flex-direction:column;
  }
  .lightbox img,.lightbox video{max-width:94vw;max-height:82vh;border-radius:10px;box-shadow:0 20px 60px rgba(0,0,0,.5)}
  .lb-close{position:absolute;top:18px;right:20px;width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.14);color:#fff;display:flex;align-items:center;justify-content:center}
  .lb-close svg{width:20px;height:20px}
  .lb-nav{position:absolute;top:50%;transform:translateY(-50%);width:42px;height:42px;border-radius:50%;background:rgba(255,255,255,.14);color:#fff;display:flex;align-items:center;justify-content:center}
  .lb-nav svg{width:22px;height:22px}
  .lb-prev{left:14px}.lb-next{right:14px}
  .lb-meta{color:#D8CEC6;font-size:13px;margin-top:12px;text-align:center}

  /* ===== 关于弹窗 ===== */
  .modal-mask{position:fixed;inset:0;z-index:70;background:rgba(45,42,38,.5);display:flex;align-items:center;justify-content:center;padding:24px}
  .modal{background:#fff;border-radius:20px;padding:26px;width:min(92vw,360px);box-shadow:var(--shadow-lg)}
  .modal h3{font-size:17px;font-weight:900;margin-bottom:6px}
  .modal .m-body{font-size:13.5px;color:var(--ink-2);line-height:1.7;margin:10px 0 18px}
  .modal .m-body b{color:var(--ink)}
  .ver-row{display:flex;justify-content:space-between;align-items:center;background:#FBF1EA;border-radius:10px;padding:9px 13px;font-size:13px;margin-bottom:8px}
  .ver-row b{color:var(--brand);font-weight:900}

  @media (max-width:640px){
    .grid{grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:8px}
    .tile .del-btn{display:flex}
    .tile .tile-badge{font-size:10px;padding:2px 6px}
    .login-card{padding:26px 20px}
    .login-tabs button{min-height:44px}
  }
  @media (prefers-reduced-motion:reduce){
    *{transition:none!important;animation:none!important}
  }
</style>
</head>
<body>

<!-- ===== 视图：登录 ===== -->
<div id="view-login">
  <div class="login-card">
    <div class="brand-row">
      <div class="brand-mark">
        <svg viewBox="0 0 24 24" fill="none"><path d="M5.5 8.5h2.2l1.3-1.8h5l1.3 1.8h2.2a2 2 0 0 1 2 2v7a2 2 0 0 1-2 2h-12a2 2 0 0 1-2-2v-7a2 2 0 0 1 2-2z" fill="#fff"/><circle cx="12" cy="13.5" r="3.2" fill="none" stroke="#FF6A88" stroke-width="1.6"/></svg>
      </div>
      <div>
        <div class="brand-name">家相册</div>
        <div class="brand-sub">把一家人的时光，放在一起</div>
      </div>
    </div>
    <div class="login-tabs">
      <button id="tab-login" class="on" type="button">登录</button>
      <button id="tab-register" type="button">注册</button>
    </div>
    <form id="form-auth" novalidate>
      <div class="field hidden" id="field-nickname">
        <label for="inp-nickname">称呼（家人会看到的名字）</label>
        <input class="input" id="inp-nickname" type="text" maxlength="12" placeholder="例如：奶奶、小杰">
      </div>
      <div class="field">
        <label for="inp-email">邮箱</label>
        <input class="input" id="inp-email" type="email" inputmode="email" autocomplete="email" placeholder="family@example.com">
      </div>
      <div class="field">
        <label for="inp-password">密码</label>
        <input class="input" id="inp-password" type="password" minlength="6" autocomplete="current-password" placeholder="至少 6 位">
      </div>
      <button class="btn btn-primary btn-block" id="btn-auth" type="submit">进入家相册</button>
    </form>
    <p class="login-note">一家人的照片只存在你们的家族空间里，其他人看不到。首次使用请先注册。</p>
  </div>
</div>

<!-- ===== 视图：欢迎（创建 / 加入家族） ===== -->
<div id="view-welcome" class="hidden">
  <div class="welcome-wrap">
    <div class="welcome-hero">
      <div class="big-icon">
        <svg viewBox="0 0 24 24" fill="none"><path d="M5.5 8.5h2.2l1.3-1.8h5l1.3 1.8h2.2a2 2 0 0 1 2 2v7a2 2 0 0 1-2 2h-12a2 2 0 0 1-2-2v-7a2 2 0 0 1 2-2z" fill="#fff"/><circle cx="12" cy="13.5" r="3.2" fill="none" stroke="#FF6A88" stroke-width="1.8"/></svg>
      </div>
      <h1>欢迎，<span id="welcome-name">家人</span></h1>
      <p>创建你们家的相册，或输入家人发你的邀请码加入</p>
    </div>
    <div class="seg">
      <button id="seg-create" class="on" type="button">创建家族</button>
      <button id="seg-join" type="button">加入家族</button>
    </div>
    <div class="welcome-card">
      <div id="panel-create">
        <div class="field">
          <label for="inp-family-name">家族名字</label>
          <input class="input" id="inp-family-name" type="text" maxlength="16" placeholder="例如：李家大院">
        </div>
        <button class="btn btn-primary btn-block" id="btn-create-family" type="button">创建并进入</button>
        <p class="code-hint">创建后会生成一个 6 位邀请码，发给家人即可加入</p>
      </div>
      <div id="panel-join" class="hidden">
        <div class="field">
          <label for="inp-code">6 位邀请码</label>
          <input class="input" id="inp-code" type="text" maxlength="6" autocomplete="off" placeholder="例如 A7K3P9" style="letter-spacing:3px;text-transform:uppercase;font-weight:900">
        </div>
        <button class="btn btn-primary btn-block" id="btn-join-family" type="button">加入</button>
        <p class="code-hint">邀请码找创建相册的家人要</p>
      </div>
    </div>
  </div>
</div>

<!-- ===== 视图：相册 ===== -->
<div id="view-album" class="hidden">
  <div class="topbar">
    <div class="tb-title">
      <div class="brand-mark" style="width:34px;height:34px;flex:0 0 34px;border-radius:10px;box-shadow:none">
        <svg viewBox="0 0 24 24" fill="none" style="width:20px;height:20px"><path d="M5.5 8.5h2.2l1.3-1.8h5l1.3 1.8h2.2a2 2 0 0 1 2 2v7a2 2 0 0 1-2 2h-12a2 2 0 0 1-2-2v-7a2 2 0 0 1 2-2z" fill="#fff"/><circle cx="12" cy="13.5" r="3.2" fill="none" stroke="#FF6A88" stroke-width="1.8"/></svg>
      </div>
      <div class="tb-name" id="tb-family-name">我的家族</div>
      <span class="tb-code" id="tb-invite-code" title="点击复制邀请码" style="cursor:pointer">邀请码</span>
    </div>
    <div class="tb-actions">
      <button class="icon-btn" id="btn-upload" type="button" title="上传照片视频">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19v-9"/><path d="m7 10 5-5 5 5"/><path d="M4 19h16"/></svg>
      </button>
      <div class="menu-wrap">
        <button class="avatar-btn" id="btn-avatar" type="button">家</button>
        <div class="menu hidden" id="menu-user">
          <div class="m-user" id="menu-user-info">—</div>
          <button type="button" id="menu-about"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 11v5"/><path d="M12 8h.01"/></svg>关于与版本更新</button>
          <button type="button" id="menu-logout"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 12H4"/><path d="m7 8-4 4 4 4"/><path d="M12 4h6a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-6"/></svg>退出登录</button>
        </div>
      </div>
    </div>
  </div>

  <div class="album-wrap">
    <div class="album-head">
      <div>
        <div class="a-title">全家照片</div>
        <div class="a-count" id="a-count">共 0 张</div>
      </div>
    </div>
    <div class="grid" id="media-grid"></div>
    <div class="empty hidden" id="empty-state">
      <svg viewBox="0 0 24 24" fill="none" stroke="#D9A27B" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5.5 8.5h2.2l1.3-1.8h5l1.3 1.8h2.2a2 2 0 0 1 2 2v7a2 2 0 0 1-2 2h-12a2 2 0 0 1-2-2v-7a2 2 0 0 1 2-2z"/><circle cx="12" cy="13.5" r="3.2"/><path d="M8 5h8"/></svg>
      <h3>相册还是空的</h3>
