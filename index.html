<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FF6A88">
<title>家相册 · 我们的一家人</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%23FF6A88'/%3E%3Cpath d='M5.5 8.5h2.2l1.3-1.8h5l1.3 1.8h2.2a2 2 0 0 1 2 2v7a2 2 0 0 1-2 2h-12a2 2 0 0 1-2-2v-7a2 2 0 0 1 2-2z' fill='%23fff'/%3E%3Ccircle cx='12' cy='13.5' r='3.2' fill='none' stroke='%23FF6A88' stroke-width='1.6'/%3E%3C/svg%3E">
<link rel="stylesheet" href="https://miaoda.feishu.cn/fonts/css2?family=Noto+Sans+SC:wght@400;500;700;900&display=swap">
<style>
  :root{
    --bg:#FFF9F5;
    --card:#FFFFFF;
    --ink:#2D2A26;
    --ink-2:#8A7F76;
    --brand:#FF6A88;
    --brand-2:#FF9A5A;
    --line:#F2E7DE;
    --ok:#3FA06A;
    --danger:#D9534F;
    --radius:16px;
    --shadow:0 1px 2px rgba(45,42,38,.05);
    --shadow-lg:0 12px 32px rgba(45,42,38,.10);
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{
    font-family:'Noto Sans SC','PingFang SC','Microsoft YaHei',system-ui,-apple-system,sans-serif;
    background:var(--bg);color:var(--ink);font-size:15px;line-height:1.55;
    -webkit-font-smoothing:antialiased;
  }
  button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
  input{font-family:inherit}
  ::placeholder{color:#BDB2A8}
  .hidden{display:none!important}

  /* ===== 通用 ===== */
  .btn{
    display:inline-flex;align-items:center;justify-content:center;gap:8px;
    padding:12px 20px;border-radius:12px;font-size:15px;font-weight:700;
    transition:transform .12s ease,box-shadow .12s ease,background .12s ease;
    user-select:none;
  }
  .btn:active{transform:scale(.97)}
  .btn-primary{background:linear-gradient(135deg,var(--brand) 0%,var(--brand-2) 100%);color:#fff;box-shadow:0 6px 16px rgba(255,106,136,.32)}
  .btn-primary:hover{box-shadow:0 8px 22px rgba(255,106,136,.42)}
  .btn-ghost{background:var(--card);color:var(--ink);border:1px solid var(--line);box-shadow:var(--shadow)}
  .btn-ghost:hover{background:#FFF4EC}
  .btn-danger{background:#FDECEA;color:var(--danger)}
  .btn-block{width:100%}
  .btn[disabled]{opacity:.55;cursor:not-allowed;transform:none;box-shadow:none}

  .field{margin-bottom:16px}
  .field label{display:block;font-size:13px;font-weight:700;color:var(--ink-2);margin-bottom:7px}
  .input{
    width:100%;padding:13px 15px;border:1.5px solid var(--line);border-radius:12px;
    font-size:16px;background:#fff;color:var(--ink);outline:none;transition:border-color .15s,box-shadow .15s;
  }
  .input:focus{border-color:var(--brand);box-shadow:0 0 0 3px rgba(255,106,136,.14)}
  .input.err{border-color:var(--danger)}

  /* ===== 品牌区 ===== */
  .brand-row{display:flex;align-items:center;gap:12px;margin-bottom:6px}
  .brand-mark{width:44px;height:44px;flex:0 0 44px;border-radius:13px;background:linear-gradient(135deg,var(--brand),var(--brand-2));display:flex;align-items:center;justify-content:center;box-shadow:0 6px 16px rgba(255,106,136,.35)}
  .brand-mark svg{width:26px;height:26px}
  .brand-name{font-size:22px;font-weight:900;letter-spacing:.5px}
  .brand-sub{font-size:13px;color:var(--ink-2);margin-top:2px}

  /* ===== 登录页 ===== */
  #view-login{
    min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;
    padding:32px 24px;position:relative;overflow:hidden;
  }
  #view-login::before{
    content:"";position:absolute;top:-140px;right:-120px;width:380px;height:380px;border-radius:50%;
    background:radial-gradient(circle,rgba(255,106,136,.18),rgba(255,154,90,.05) 70%);
    pointer-events:none;
  }
  #view-login::after{
    content:"";position:absolute;bottom:-160px;left:-140px;width:360px;height:360px;border-radius:50%;
    background:radial-gradient(circle,rgba(255,154,90,.16),rgba(255,106,136,.04) 70%);
    pointer-events:none;
  }
  .login-card{
    width:100%;max-width:400px;background:var(--card);border:1px solid var(--line);
    border-radius:24px;padding:32px 26px;box-shadow:var(--shadow-lg);position:relative;z-index:1;
  }
  .login-tabs{display:flex;background:#FBF1EA;border-radius:12px;padding:4px;margin:22px 0 20px}
  .login-tabs button{flex:1;padding:9px 0;border-radius:9px;font-size:14px;font-weight:700;color:var(--ink-2);transition:all .15s}
  .login-tabs button.on{background:#fff;color:var(--ink);box-shadow:var(--shadow)}
  .form-foot{margin-top:4px;font-size:12.5px;color:var(--ink-2);text-align:center}
  .login-note{margin-top:18px;padding:11px 14px;background:#FFF6EC;border:1px solid #FFE3C7;border-radius:12px;font-size:12.5px;color:#A8763C;line-height:1.6}

  /* ===== 顶部栏 ===== */
  .topbar{
    position:sticky;top:0;z-index:20;background:rgba(255,249,245,.92);backdrop-filter:blur(8px);
    border-bottom:1px solid var(--line);padding:12px 18px;
    display:flex;align-items:center;gap:10px;max-width:900px;margin:0 auto;
  }
  .topbar .tb-title{display:flex;align-items:center;gap:9px;min-width:0;flex:1}
  .topbar .tb-name{font-size:17px;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .topbar .tb-code{font-size:11.5px;color:var(--ink-2);background:#fff;border:1px solid var(--line);padding:2px 8px;border-radius:20px;white-space:nowrap}
  .avatar-btn{
    width:38px;height:38px;border-radius:50%;background:linear-gradient(135deg,var(--brand),var(--brand-2));
    color:#fff;font-weight:900;font-size:15px;display:flex;align-items:center;justify-content:center;flex:0 0 38px;
  }
  .tb-actions{display:flex;align-items:center;gap:8px}
  .icon-btn{
    width:38px;height:38px;border-radius:11px;background:var(--card);border:1px solid var(--line);
    display:flex;align-items:center;justify-content:center;color:var(--ink);transition:all .15s;position:relative;
  }
  .icon-btn:hover{background:#FFF4EC;border-color:#FFD9C7}
  .icon-btn svg{width:19px;height:19px}
  .icon-btn.danger:hover{background:#FDECEA;color:var(--danger);border-color:#F6C7C3}

  /* 下拉菜单 */
  .menu-wrap{position:relative}
  .menu{
    position:absolute;right:0;top:46px;background:#fff;border:1px solid var(--line);border-radius:14px;
    box-shadow:var(--shadow-lg);min-width:190px;padding:6px;z-index:30;animation:pop .14s ease;
  }
  .menu button{display:flex;align-items:center;gap:10px;width:100%;padding:10px 12px;border-radius:9px;font-size:14px;text-align:left}
  .menu button:hover{background:#FFF4EC}
  .menu button svg{width:17px;height:17px;color:var(--ink-2);flex:0 0 17px}
  .menu .m-user{font-size:12.5px;color:var(--ink-2);padding:8px 12px 6px;border-bottom:1px solid var(--line);margin-bottom:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  @keyframes pop{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}

  /* ===== 欢迎页（创建/加入家族） ===== */
  .welcome-wrap{max-width:460px;margin:0 auto;padding:56px 22px 40px}
  .welcome-hero{text-align:center;margin-bottom:34px}
  .welcome-hero .big-icon{width:86px;height:86px;margin:0 auto 18px;border-radius:26px;background:linear-gradient(135deg,var(--brand),var(--brand-2));display:flex;align-items:center;justify-content:center;box-shadow:0 14px 30px rgba(255,106,136,.35)}
  .welcome-hero .big-icon svg{width:44px;height:44px}
  .welcome-hero h1{font-size:24px;font-weight:900;letter-spacing:.5px}
  .welcome-hero p{color:var(--ink-2);font-size:14px;margin-top:8px}
  .seg{display:flex;background:#FBF1EA;border-radius:13px;padding:4px;margin-bottom:24px}
  .seg button{flex:1;padding:11px 0;border-radius:10px;font-size:14px;font-weight:700;color:var(--ink-2)}
  .seg button.on{background:#fff;color:var(--ink);box-shadow:var(--shadow)}
  .welcome-card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:26px;box-shadow:var(--shadow-lg)}
  .code-hint{font-size:12.5px;color:var(--ink-2);text-align:center;margin-top:14px}
  .code-hint b{color:var(--brand);font-size:13px;letter-spacing:1px}

  /* ===== 相册 ===== */
  .album-wrap{max-width:900px;margin:0 auto;padding:18px 16px 90px}
  .album-head{display:flex;align-items:center;justify-content:space-between;margin:6px 2px 16px}
  .album-head .a-title{font-size:18px;font-weight:900}
  .album-head .a-count{font-size:13px;color:var(--ink-2);margin-top:2px}

  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:10px}
  .tile{
    position:relative;border-radius:13px;overflow:hidden;background:#F3EAE2;
    aspect-ratio:1;cursor:pointer;box-shadow:var(--shadow);
    transition:transform .14s ease,box-shadow .14s ease;
  }
  .tile:hover{transform:translateY(-2px);box-shadow:var(--shadow-lg)}
  .tile img,.tile video{width:100%;height:100%;object-fit:cover;display:block;background:#F3EAE2}
  .tile .tile-badge{
    position:absolute;left:8px;top:8px;background:rgba(45,42,38,.62);color:#fff;border-radius:8px;
    padding:3px 8px;font-size:11px;display:flex;align-items:center;gap:4px;backdrop-filter:blur(4px);
  }
  .tile .tile-badge svg{width:13px;height:13px}
  .tile .tile-info{
    position:absolute;left:0;right:0;bottom:0;padding:20px 9px 7px;color:#fff;font-size:11px;
    background:linear-gradient(to top,rgba(45,42,38,.72),transparent);display:flex;justify-content:space-between;gap:6px;
  }
  .tile .tile-info span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .tile .del-btn{
    position:absolute;right:7px;top:7px;width:27px;height:27px;border-radius:50%;
    background:rgba(45,42,38,.55);color:#fff;display:none;align-items:center;justify-content:center;z-index:2;
  }
  .tile .del-btn svg{width:14px;height:14px}
  .tile:hover .del-btn{display:flex}
  .tile .del-btn:hover{background:var(--danger)}

  /* 空态 */
  .empty{text-align:center;padding:70px 20px;color:var(--ink-2)}
  .empty svg{width:72px;height:72px;margin-bottom:16px;opacity:.85}
  .empty h3{font-size:18px;font-weight:900;color:var(--ink);margin-bottom:8px}
  .empty p{font-size:13.5px;line-height:1.7}

  /* 拖拽上传遮罩 */
  .drop-mask{
    position:fixed;inset:0;z-index:60;background:rgba(45,42,38,.45);display:flex;align-items:center;justify-content:center;
  }
  .drop-box{
    width:min(86vw,420px);padding:46px 28px;background:#fff;border-radius:22px;text-align:center;
    border:2px dashed var(--brand);
  }
  .drop-box svg{width:52px;height:52px;margin-bottom:14px}
  .drop-box h3{font-size:18px;font-weight:900}
  .drop-box p{font-size:13px;color:var(--ink-2);margin-top:6px}

  /* 上传进度 */
  .toast-wrap{position:fixed;left:50%;transform:translateX(-50%);bottom:26px;z-index:90;display:flex;flex-direction:column;gap:8px;align-items:center;width:min(92vw,420px)}
  .toast{
    background:rgba(45,42,38,.92);color:#fff;border-radius:12px;padding:11px 18px;font-size:13.5px;
    box-shadow:var(--shadow-lg);display:flex;align-items:center;gap:9px;max-width:100%;
    animation:pop .18s ease;
  }
  .toast.ok{background:rgba(63,160,106,.94)}
  .toast.err{background:rgba(217,83,79,.95)}
  .toast svg{width:16px;height:16px;flex:0 0 16px}
  .toast .bar{width:100%;height:4px;border-radius:2px;background:rgba(255,255,255,.25);overflow:hidden;margin-top:2px}
  .toast .bar i{display:block;height:100%;background:#fff;border-radius:2px;transition:width .15s}

  /* 大图查看 */
  .lightbox{
    position:fixed;inset:0;z-index:80;background:rgba(20,18,16,.92);display:flex;align-items:center;justify-content:center;flex-direction:column;
  }
  .lightbox img,.lightbox video{max-width:94vw;max-height:82vh;border-radius:10px;box-shadow:0 20px 60px rgba(0,0,0,.5)}
  .lb-close{position:absolute;top:18px;right:20px;width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.14);color:#fff;display:flex;align-items:center;justify-content:center}
  .lb-close svg{width:20px;height:20px}
  .lb-nav{position:absolute;top:50%;transform:translateY(-50%);width:42px;height:42px;border-radius:50%;background:rgba(255,255,255,.14);color:#fff;display:flex;align-items:center;justify-content:center}
  .lb-nav svg{width:22px;height:22px}
  .lb-prev{left:14px}.lb-next{right:14px}
  .lb-meta{color:#D8CEC6;font-size:13px;margin-top:12px;text-align:center}

  /* ===== 关于弹窗 ===== */
  .modal-mask{position:fixed;inset:0;z-index:70;background:rgba(45,42,38,.5);display:flex;align-items:center;justify-content:center;padding:24px}
  .modal{background:#fff;border-radius:20px;padding:26px;width:min(92vw,360px);box-shadow:var(--shadow-lg)}
  .modal h3{font-size:17px;font-weight:900;margin-bottom:6px}
  .modal .m-body{font-size:13.5px;color:var(--ink-2);line-height:1.7;margin:10px 0 18px}
  .modal .m-body b{color:var(--ink)}
  .ver-row{display:flex;justify-content:space-between;align-items:center;background:#FBF1EA;border-radius:10px;padding:9px 13px;font-size:13px;margin-bottom:8px}
  .ver-row b{color:var(--brand);font-weight:900}

  @media (max-width:640px){
    .grid{grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:8px}
    .tile .del-btn{display:flex}
    .tile .tile-badge{font-size:10px;padding:2px 6px}
    .login-card{padding:26px 20px}
    .login-tabs button{min-height:44px}
  }
  @media (prefers-reduced-motion:reduce){
    *{transition:none!important;animation:none!important}
  }
</style>
</head>
<body>

<!-- ===== 视图：登录 ===== -->
<div id="view-login">
  <div class="login-card">
    <div class="brand-row">
      <div class="brand-mark">
        <svg viewBox="0 0 24 24" fill="none"><path d="M5.5 8.5h2.2l1.3-1.8h5l1.3 1.8h2.2a2 2 0 0 1 2 2v7a2 2 0 0 1-2 2h-12a2 2 0 0 1-2-2v-7a2 2 0 0 1 2-2z" fill="#fff"/><circle cx="12" cy="13.5" r="3.2" fill="none" stroke="#FF6A88" stroke-width="1.6"/></svg>
      </div>
      <div>
        <div class="brand-name">家相册</div>
        <div class="brand-sub">把一家人的时光，放在一起</div>
      </div>
    </div>
    <div class="login-tabs">
      <button id="tab-login" class="on" type="button">登录</button>
      <button id="tab-register" type="button">注册</button>
    </div>
    <form id="form-auth" novalidate>
      <div class="field hidden" id="field-nickname">
        <label for="inp-nickname">称呼（家人会看到的名字）</label>
        <input class="input" id="inp-nickname" type="text" maxlength="12" placeholder="例如：奶奶、小杰">
      </div>
      <div class="field">
        <label for="inp-email">邮箱</label>
        <input class="input" id="inp-email" type="email" inputmode="email" autocomplete="email" placeholder="family@example.com">
      </div>
      <div class="field">
        <label for="inp-password">密码</label>
        <input class="input" id="inp-password" type="password" minlength="6" autocomplete="current-password" placeholder="至少 6 位">
      </div>
      <button class="btn btn-primary btn-block" id="btn-auth" type="submit">进入家相册</button>
    </form>
    <p class="login-note">一家人的照片只存在你们的家族空间里，其他人看不到。首次使用请先注册。</p>
  </div>
</div>

<!-- ===== 视图：欢迎（创建 / 加入家族） ===== -->
<div id="view-welcome" class="hidden">
  <div class="welcome-wrap">
    <div class="welcome-hero">
      <div class="big-icon">
        <svg viewBox="0 0 24 24" fill="none"><path d="M5.5 8.5h2.2l1.3-1.8h5l1.3 1.8h2.2a2 2 0 0 1 2 2v7a2 2 0 0 1-2 2h-12a2 2 0 0 1-2-2v-7a2 2 0 0 1 2-2z" fill="#fff"/><circle cx="12" cy="13.5" r="3.2" fill="none" stroke="#FF6A88" stroke-width="1.8"/></svg>
      </div>
      <h1>欢迎，<span id="welcome-name">家人</span></h1>
      <p>创建你们家的相册，或输入家人发你的邀请码加入</p>
    </div>
    <div class="seg">
      <button id="seg-create" class="on" type="button">创建家族</button>
      <button id="seg-join" type="button">加入家族</button>
    </div>
    <div class="welcome-card">
      <div id="panel-create">
        <div class="field">
          <label for="inp-family-name">家族名字</label>
          <input class="input" id="inp-family-name" type="text" maxlength="16" placeholder="例如：李家大院">
        </div>
        <button class="btn btn-primary btn-block" id="btn-create-family" type="button">创建并进入</button>
        <p class="code-hint">创建后会生成一个 6 位邀请码，发给家人即可加入</p>
      </div>
      <div id="panel-join" class="hidden">
        <div class="field">
          <label for="inp-code">6 位邀请码</label>
          <input class="input" id="inp-code" type="text" maxlength="6" autocomplete="off" placeholder="例如 A7K3P9" style="letter-spacing:3px;text-transform:uppercase;font-weight:900">
        </div>
        <button class="btn btn-primary btn-block" id="btn-join-family" type="button">加入</button>
        <p class="code-hint">邀请码找创建相册的家人要</p>
      </div>
    </div>
  </div>
</div>

<!-- ===== 视图：相册 ===== -->
<div id="view-album" class="hidden">
  <div class="topbar">
    <div class="tb-title">
      <div class="brand-mark" style="width:34px;height:34px;flex:0 0 34px;border-radius:10px;box-shadow:none">
        <svg viewBox="0 0 24 24" fill="none" style="width:20px;height:20px"><path d="M5.5 8.5h2.2l1.3-1.8h5l1.3 1.8h2.2a2 2 0 0 1 2 2v7a2 2 0 0 1-2 2h-12a2 2 0 0 1-2-2v-7a2 2 0 0 1 2-2z" fill="#fff"/><circle cx="12" cy="13.5" r="3.2" fill="none" stroke="#FF6A88" stroke-width="1.8"/></svg>
      </div>
      <div class="tb-name" id="tb-family-name">我的家族</div>
      <span class="tb-code" id="tb-invite-code" title="点击复制邀请码" style="cursor:pointer">邀请码</span>
    </div>
    <div class="tb-actions">
      <button class="icon-btn" id="btn-upload" type="button" title="上传照片视频">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19v-9"/><path d="m7 10 5-5 5 5"/><path d="M4 19h16"/></svg>
      </button>
      <div class="menu-wrap">
        <button class="avatar-btn" id="btn-avatar" type="button">家</button>
        <div class="menu hidden" id="menu-user">
          <div class="m-user" id="menu-user-info">—</div>
          <button type="button" id="menu-about"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 11v5"/><path d="M12 8h.01"/></svg>关于与版本更新</button>
          <button type="button" id="menu-logout"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 12H4"/><path d="m7 8-4 4 4 4"/><path d="M12 4h6a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-6"/></svg>退出登录</button>
        </div>
      </div>
    </div>
  </div>

  <div class="album-wrap">
    <div class="album-head">
      <div>
        <div class="a-title">全家照片</div>
        <div class="a-count" id="a-count">共 0 张</div>
      </div>
    </div>
    <div class="grid" id="media-grid"></div>
    <div class="empty hidden" id="empty-state">
      <svg viewBox="0 0 24 24" fill="none" stroke="#D9A27B" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5.5 8.5h2.2l1.3-1.8h5l1.3 1.8h2.2a2 2 0 0 1 2 2v7a2 2 0 0 1-2 2h-12a2 2 0 0 1-2-2v-7a2 2 0 0 1 2-2z"/><circle cx="12" cy="13.5" r="3.2"/><path d="M8 5h8"/></svg>
      <h3>相册还是空的</h3>

<script>
/* ================================================================
 * 配置区 —— 部署前必须粘贴你的 Supabase 项目信息（两行）
 * 在 supabase.com 后台：Project Settings → API
 * ================================================================ */
const SUPABASE_URL = "https://zsvbczqlsmgiupviuxxq.supabase.co";   // ← 你的项目地址
const SUPABASE_ANON_KEY = "sb_publishable_1qf3jqhAP3SCiJYcJfZZIg_866w_zW_";          // ← 你的 anon public key
const APP_VERSION = "1.0.0";
const GITHUB_REPO = "jjzx060318ab/jazapp";                 // 用于检查 GitHub 上的新版本
/* ================================================================ */

const $ = (s) => document.querySelector(s);

/* ---------- 工具 ---------- */
function toast(msg, type = "info", ms = 2600) {
  const wrap = document.querySelector(".toast-wrap") || (() => {
    const w = document.createElement("div");
    w.className = "toast-wrap";
    document.body.appendChild(w);
    return w;
  })();
  const t = document.createElement("div");
  t.className = "toast " + (type === "ok" ? "ok" : type === "err" ? "err" : "");
  const icon = type === "ok" ? '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m4.5 12.5 5 5 10-11"/></svg>'
    : type === "err" ? '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg>'
    : '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 11v5"/><path d="M12 8h.01"/></svg>';
  t.innerHTML = icon + "<span>" + msg + "</span>";
  wrap.appendChild(t);
  setTimeout(() => { t.style.opacity = "0"; t.style.transition = "opacity .3s"; setTimeout(() => t.remove(), 320); }, ms);
}
function errText(e) {
  let m = "";
  try {
    if (typeof e === "string") m = e;
    else if (e && e.error_description) m = e.error_description;
    else if (e && e.msg) m = e.msg;
    else if (e && e.message) {
      try { const j = JSON.parse(e.message); m = j.message || e.message; } catch (_) { m = e.message; }
    }
    else if (e && e.code === "P0001") m = "操作失败，请稍后再试";
  } catch (_) {}
  m = m || "出错了，请稍后再试";
  if (/not confirmed|confirm.*email/i.test(m)) m = "邮箱还没确认：请到邮箱点确认链接，或在后台关闭邮箱确认";
  if (/email.*invalid|invalid.*email|email_address_invalid/i.test(m)) m = "邮箱格式不对，或被项目限制（检查邮箱域名限制设置）";
  if (/failed to fetch|network|fetch failed|ERR_/i.test(m)) m = "网络连接失败，请检查网络后重试";
  if (/row-level security policy|violates row-level security/i.test(m)) m = "数据库还没初始化：请在 Supabase 后台 SQL Editor 运行 setup.sql 初始化脚本";
  if (/signups? are? disabled|signup.*not allowed|not allowed.*signup/i.test(m)) m = "后台关闭了邮箱注册：请到 Authentication → Providers → Email 打开 Enable email signups";
  if (/rate limit|too many/i.test(m)) m = "操作太频繁：稍等几分钟再试（注册前请先在后台关闭邮箱确认）";
  if (/invalid api key/i.test(m)) m = "密钥配置错误，请联系管理员";
  if (/already/i.test(m)) m = "这个邮箱已经注册过了，直接登录即可";
  if (/invalid login|invalid_credentials/i.test(m)) m = "邮箱或密码不正确";
  return m;
}
function esc(s) {
  return String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}
function timeAgo(t) {
  const d = (Date.now() - new Date(t).getTime()) / 1000;
  if (d < 60) return "刚刚";
  if (d < 3600) return Math.floor(d / 60) + " 分钟前";
  if (d < 86400) return Math.floor(d / 3600) + " 小时前";
  if (d < 86400 * 7) return Math.floor(d / 86400) + " 天前";
  return new Date(t).toLocaleDateString("zh-CN");
}

/* ---------- 会话 ---------- */
const Session = {
  get token() { return localStorage.getItem("fa_token"); },
  get user() {
    try { return JSON.parse(localStorage.getItem("fa_user") || "null"); } catch (_) { return null; }
  },
  save(token, user) {
    localStorage.setItem("fa_token", token);
    localStorage.setItem("fa_user", JSON.stringify(user));
  },
  clear() {
    localStorage.removeItem("fa_token");
    localStorage.removeItem("fa_user");
    localStorage.removeItem("fa_family");
  },
  get family() {
    try { return JSON.parse(localStorage.getItem("fa_family") || "null"); } catch (_) { return null; }
  },
  saveFamily(f) { localStorage.setItem("fa_family", JSON.stringify(f)); }
};

/* ---------- Supabase 请求 ---------- */
function apiHeaders(token) {
  return {
    "apikey": SUPABASE_ANON_KEY,
    "Authorization": "Bearer " + (token || SUPABASE_ANON_KEY),
    "Content-Type": "application/json",
  };
}
async function apiFetch(url, opts = {}) {
  const res = await fetch(url, opts);
  let data = null;
  const ct = res.headers.get("content-type") || "";
  if (ct.includes("json")) { try { data = await res.json(); } catch (_) {} }
  if (!res.ok) {
    const msg = data && (data.msg || data.message || data.error_description || data.detail) || ("请求失败 " + res.status);
    throw { status: res.status, message: msg, data };
  }
  return data;
}

/* ---------- 视图切换 ---------- */
const views = ["view-login", "view-welcome", "view-album"];
function showView(name) {
  views.forEach(v => $("#" + v).classList.toggle("hidden", v !== name));
}
function renderUserMeta() {
  const u = Session.user;
  const name = (u && (u.user_metadata && u.user_metadata.nickname)) || (u && (u.email || "家人"));
  const ch = (name || "家").trim().charAt(0).toUpperCase();
  $("#btn-avatar").textContent = ch;
  $("#welcome-name").textContent = name;
  $("#menu-user-info").textContent = (u && u.email) || name;
}

/* ---------- 认证 ---------- */
async function authSignup(email, password, nickname) {
  const data = await apiFetch(SUPABASE_URL + "/auth/v1/signup", {
    method: "POST",
    headers: apiHeaders(),
    body: JSON.stringify({ email, password, data: { nickname } }),
  });
  if (data && data.access_token) {
    Session.save(data.access_token, data.user);
  }
  return data;
}
async function authLogin(email, password) {
  const data = await apiFetch(SUPABASE_URL + "/auth/v1/token?grant_type=password", {
    method: "POST",
    headers: apiHeaders(),
    body: JSON.stringify({ email, password }),
  });
  Session.save(data.access_token, data.user);
  return data;
}
async function authMe() {
  if (!Session.token) return null;
  try {
    const u = await apiFetch(SUPABASE_URL + "/auth/v1/user", { headers: apiHeaders(Session.token) });
    Session.save(Session.token, u);
    return u;
  } catch (_) { return null; }
}

/* ---------- 家族 ---------- */
function genCode(len = 6) {
  const chars = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
  let s = "";
  for (let i = 0; i < len; i++) s += chars[Math.floor(Math.random() * chars.length)];
  return s;
}
async function fetchMyFamilies() {
  return await apiFetch(SUPABASE_URL + "/rest/v1/families?select=*", { headers: apiHeaders(Session.token) });
}
async function createFamily(name) {
  // 走数据库安全函数创建（与加入家族同一机制，不受 RLS 策略兼容问题影响）
  const fam = await apiFetch(SUPABASE_URL + "/rest/v1/rpc/create_family", {
    method: "POST",
    headers: { ...apiHeaders(Session.token) },
    body: JSON.stringify({ p_name: name }),
  });
  return fam && fam.id ? fam : null;
}
async function joinFamily(code) {
  const res = await apiFetch(SUPABASE_URL + "/rest/v1/rpc/join_family_by_code", {
    method: "POST",
    headers: apiHeaders(Session.token),
    body: JSON.stringify({ p_code: String(code || "").toUpperCase().trim() }),
  });
  return res;
}
async function fetchMedia(familyId) {
  return await apiFetch(SUPABASE_URL + "/rest/v1/media?select=*&family_id=eq." + familyId + "&order=created_at.desc", {
    headers: apiHeaders(Session.token),
  });
}

/* ---------- 上传 ---------- */
function uuid() {
  if (window.crypto && crypto.randomUUID) return crypto.randomUUID();
  return "xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx".replace(/[xy]/g, c => {
    const r = Math.random() * 16 | 0;
    return (c === "x" ? r : (r & 0x3 | 0x8)).toString(16);
  });
}
async function uploadOne(file, family, onProgress) {
  const name = file.name || "";
  const ext = (name.split(".").pop() || "").toLowerCase().replace(/[^a-z0-9]/g, "");
  const okExt = ["jpg","jpeg","png","gif","webp","heic","heif","mp4","mov","m4v","webm","avi","3gp","mkv"];
  const safeExt = okExt.indexOf(ext) >= 0 ? ext : (file.type.startsWith("video") ? "mp4" : "jpg");
  const path = family.id + "/" + uuid() + "." + safeExt;
  const type = file.type.startsWith("video") ? "video" : "photo";

  await new Promise((resolve, reject) => {
    const xhr = new XMLHttpRequest();
    xhr.open("POST", SUPABASE_URL + "/storage/v1/object/family-album/" + path);
    xhr.setRequestHeader("apikey", SUPABASE_ANON_KEY);
    xhr.setRequestHeader("Authorization", "Bearer " + Session.token);
    xhr.setRequestHeader("Content-Type", file.type || "application/octet-stream");
    xhr.setRequestHeader("x-upsert", "true");
    xhr.upload.onprogress = (e) => { if (e.lengthComputable && onProgress) onProgress(e.loaded / e.total); };
    xhr.onload = () => {
      try {
        const j = JSON.parse(xhr.responseText);
        if (j && j.Key) resolve(j); else reject(new Error((j && j.message) || "上传失败"));
      } catch (_) { reject(new Error("上传失败")); }
    };
    xhr.onerror = () => reject(new Error("网络异常，上传失败"));
    xhr.send(file);
  });

  const uploaderName = (Session.user && Session.user.user_metadata && Session.user.user_metadata.nickname) || "家人";
  await apiFetch(SUPABASE_URL + "/rest/v1/media", {
    method: "POST",
    headers: { ...apiHeaders(Session.token), Prefer: "return=representation" },
    body: JSON.stringify({ family_id: family.id, uploader_id: Session.user.id, uploader_name: uploaderName, type, storage_path: path }),
  });
  return SUPABASE_URL + "/storage/v1/object/public/family-album/" + path;
}

let uploadRunning = false;
function progressToast() {
  const wrap = document.querySelector(".toast-wrap") || (() => {
    const w = document.createElement("div"); w.className = "toast-wrap"; document.body.appendChild(w); return w;
  })();
  const t = document.createElement("div");
  t.className = "toast";
  t.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 16V7"/><path d="m7 11 5-5 5 5"/></svg><span style="min-width:120px">上传中</span>';
  const bar = document.createElement("div"); bar.className = "bar";
  const fill = document.createElement("i"); fill.style.width = "0%";
  bar.appendChild(fill); t.appendChild(bar);
  wrap.appendChild(t);
  return {
    update(f, label) {
      const s = t.querySelector("span");
      if (s) s.textContent = label || ("上传中 " + Math.round(f * 100) + "%");
      fill.style.width = Math.min(100, Math.round(f * 100)) + "%";
    },
    done() { t.remove(); },
  };
}
async function handleFiles(list) {
  if (uploadRunning) { toast("正在上传，请稍候", "err"); return; }
  const files = Array.from(list || []).filter(f => f.type && (f.type.startsWith("image/") || f.type.startsWith("video/")));
  if (!files.length) { toast("请选择照片或视频文件", "err"); return; }
  const family = Session.family;
  if (!family) return;
  uploadRunning = true;
  const total = files.length;
  let ok = 0, fail = 0;
  const p = progressToast();
  p.update(0, "准备上传 0/" + total);
  for (let i = 0; i < total; i++) {
    const f = files[i];
    try {
      await uploadOne(f, family, frac => p.update((i + frac) / total, "上传中 " + (i + 1) + "/" + total + " · " + (f.name || "").slice(0, 14)));
      ok++;
    } catch (err) {
      fail++;
      toast((f.name || "文件") + "：" + errText(err), "err", 2400);
    }
  }
  p.done();
  uploadRunning = false;
  if (fail) toast("完成：" + ok + " 成功，" + fail + " 失败", "err", 3200);
  else toast("已上传 " + ok + " 个", "ok", 2400);
  await loadAlbum();
}

/* ---------- 删除 ---------- */
async function deleteMedia(item) {
  await apiFetch(SUPABASE_URL + "/rest/v1/media?id=eq." + item.id, { method: "DELETE", headers: apiHeaders(Session.token) });
  try {
    await fetch(SUPABASE_URL + "/storage/v1/object/family-album/" + item.storage_path, {
      method: "DELETE",
      headers: { apikey: SUPABASE_ANON_KEY, Authorization: "Bearer " + Session.token },
    });
  } catch (_) {}
}

/* ---------- 渲染 ---------- */
let currentMedia = [];
function renderGrid() {
  const grid = $("#media-grid");
  grid.innerHTML = "";
  $("#a-count").textContent = "共 " + currentMedia.length + " 个";
  $("#empty-state").classList.toggle("hidden", currentMedia.length > 0);
  currentMedia.forEach((m, i) => {
    const url = SUPABASE_URL + "/storage/v1/object/public/family-album/" + m.storage_path;
    const tile = document.createElement("div");
    tile.className = "tile";
    tile.dataset.i = String(i);
    const badge = m.type === "video"
      ? '<span class="tile-badge"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5.5v13l11-6.5z"/></svg>视频</span>'
      : "";
    const who = esc(m.uploader_name || "家人");
    const when = timeAgo(m.created_at);
    tile.innerHTML = badge
      + (m.type === "video"
        ? '<video muted preload="metadata" src="' + esc(url) + '"></video>'
        : '<img loading="lazy" src="' + esc(url) + '" alt="">')
      + '<div class="tile-info"><span>' + who + '</span><span>' + when + '</span></div>'
      + '<button class="del-btn" data-id="' + m.id + '" title="删除"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M4 7h16M9 7V5a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2m3 0-.8 12a2 2 0 0 1-2 1.9H8.8a2 2 0 0 1-2-1.9L6 7"/></svg></button>';
    tile.addEventListener("click", (e) => {
      if (e.target.closest(".del-btn")) return;
      openLightbox(Number(tile.dataset.i));
    });
    grid.appendChild(tile);
  });
  grid.querySelectorAll(".del-btn").forEach(btn => {
    btn.addEventListener("click", async (e) => {
      e.stopPropagation();
      const id = btn.dataset.id;
      const item = currentMedia.find(x => x.id === id);
      if (!item) return;
      if (item.uploader_id !== Session.user.id) { toast("只能删除自己上传的内容", "err"); return; }
      if (!confirm("确定删除这条" + (item.type === "video" ? "视频" : "照片") + "吗？")) return;
      try { await deleteMedia(item); toast("已删除", "ok"); await loadAlbum(); }
      catch (err) { toast(errText(err), "err"); }
    });
  });
}

/* ---------- 流程 ---------- */
async function boot() {
  const user = await authMe();
  if (!user) { Session.clear(); showView("view-login"); return; }
  renderUserMeta();
  try {
    const families = await fetchMyFamilies();
    if (families && families.length) { Session.saveFamily(families[0]); await enterAlbum(); }
    else { Session.saveFamily(null); showView("view-welcome"); }
  } catch (err) {
    if (Session.family) { await enterAlbum(); }
    else { showView("view-welcome"); }
  }
}
async function enterAlbum() {
  const fam = Session.family;
  if (!fam) return;
  $("#tb-family-name").textContent = fam.name;
  $("#tb-invite-code").textContent = "邀请码 " + fam.invite_code;
  showView("view-album");
  await loadAlbum();
}
async function loadAlbum() {
  const fam = Session.family;
  if (!fam) return;
  try { currentMedia = await fetchMedia(fam.id); renderGrid(); }
  catch (err) { toast(errText(err), "err"); }
}

/* ---------- 大图查看 ---------- */
let lbIndex = 0;
function openLightbox(i) {
  if (!currentMedia.length) return;
  lbIndex = (i + currentMedia.length) % currentMedia.length;
  renderLightbox();
  $("#lightbox").classList.remove("hidden");
  document.body.style.overflow = "hidden";
}
function closeLightbox() {
  $("#lightbox").classList.add("hidden");
  document.body.style.overflow = "";
  $("#lb-stage").innerHTML = "";
}
function renderLightbox() {
  const m = currentMedia[lbIndex];
  const url = SUPABASE_URL + "/storage/v1/object/public/family-album/" + m.storage_path;
  $("#lb-stage").innerHTML = m.type === "video"
    ? '<video controls autoplay src="' + esc(url) + '"></video>'
    : '<img src="' + esc(url) + '" alt="">';
  $("#lb-meta").textContent = esc(m.uploader_name || "家人") + " · " + new Date(m.created_at).toLocaleString("zh-CN");
  $("#lb-prev").classList.toggle("hidden", currentMedia.length <= 1);
  $("#lb-next").classList.toggle("hidden", currentMedia.length <= 1);
}
$("#lb-close").addEventListener("click", closeLightbox);
$("#lb-prev").addEventListener("click", (e) => { e.stopPropagation(); lbIndex = (lbIndex - 1 + currentMedia.length) % currentMedia.length; renderLightbox(); });
$("#lb-next").addEventListener("click", (e) => { e.stopPropagation(); lbIndex = (lbIndex + 1) % currentMedia.length; renderLightbox(); });
$("#lightbox").addEventListener("click", (e) => {
  if (e.target === $("#lightbox") || e.target === $("#lb-stage")) closeLightbox();
});
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape") { closeLightbox(); $("#modal-about").classList.add("hidden"); }
  if (e.key === "ArrowLeft" && !$("#lightbox").classList.contains("hidden")) { lbIndex = (lbIndex - 1 + currentMedia.length) % currentMedia.length; renderLightbox(); }
  if (e.key === "ArrowRight" && !$("#lightbox").classList.contains("hidden")) { lbIndex = (lbIndex + 1) % currentMedia.length; renderLightbox(); }
});

/* ---------- 关于与版本更新 ---------- */
async function checkVersion() {
  $("#ver-latest").textContent = "检查中…";
  try {
    const res = await fetch("https://api.github.com/repos/" + GITHUB_REPO + "/releases/latest", { headers: { Accept: "application/vnd.github+json" } });
    if (!res.ok) throw new Error("none");
    const rel = await res.json();
    $("#ver-latest").textContent = (rel.tag_name || rel.name || "有新版本");
  } catch (_) {
    $("#ver-latest").textContent = "暂无更新信息";
  }
}

/* ---------- 认证页事件 ---------- */
let authMode = "login";
$("#tab-login").addEventListener("click", () => {
  authMode = "login";
  $("#tab-login").classList.add("on"); $("#tab-register").classList.remove("on");
  $("#field-nickname").classList.add("hidden");
  $("#btn-auth").textContent = "进入家相册";
});
$("#tab-register").addEventListener("click", () => {
  authMode = "register";
  $("#tab-register").classList.add("on"); $("#tab-login").classList.remove("on");
  $("#field-nickname").classList.remove("hidden");
  $("#btn-auth").textContent = "注册并进入";
});
$("#form-auth").addEventListener("submit", async (e) => {
  e.preventDefault();
  const email = $("#inp-email").value.trim();
  const password = $("#inp-password").value;
  const nickname = $("#inp-nickname").value.trim();
  if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) { toast("请输入正确的邮箱", "err"); return; }
  if (password.length < 6) { toast("密码至少 6 位", "err"); return; }
  if (authMode === "register" && !nickname) { toast("请填写称呼", "err"); return; }
  const btn = $("#btn-auth");
  btn.disabled = true; btn.textContent = "请稍候…";
  try {
    if (authMode === "register") {
      const data = await authSignup(email, password, nickname);
      if (!data || !data.access_token) { toast("注册成功，请先到邮箱点击确认链接，再回来登录", "ok", 4200); return; }
    } else {
      await authLogin(email, password);
    }
    toast("欢迎回来", "ok");
    await boot();
  } catch (err) {
    toast(errText(err), "err", 3400);
  } finally {
    btn.disabled = false;
    btn.textContent = authMode === "register" ? "注册并进入" : "进入家相册";
  }
});

/* ---------- 欢迎页事件 ---------- */
$("#seg-create").addEventListener("click", () => {
  $("#seg-create").classList.add("on"); $("#seg-join").classList.remove("on");
  $("#panel-create").classList.remove("hidden"); $("#panel-join").classList.add("hidden");
});
$("#seg-join").addEventListener("click", () => {
  $("#seg-join").classList.add("on"); $("#seg-create").classList.remove("on");
  $("#panel-join").classList.remove("hidden"); $("#panel-create").classList.add("hidden");
});
$("#btn-create-family").addEventListener("click", async () => {
  const name = $("#inp-family-name").value.trim();
  if (!name) { toast("请填写家族名字", "err"); return; }
  const btn = $("#btn-create-family");
  btn.disabled = true; btn.textContent = "创建中…";
  try {
    const fam = await createFamily(name);
    Session.saveFamily(fam);
    toast("家族创建成功，邀请码：" + fam.invite_code, "ok", 4200);
    await enterAlbum();
  } catch (err) { toast(errText(err), "err"); }
  finally { btn.disabled = false; btn.textContent = "创建并进入"; }
});
$("#btn-join-family").addEventListener("click", async () => {
  const code = $("#inp-code").value.trim().toUpperCase();
  if (code.length !== 6) { toast("邀请码是 6 位", "err"); return; }
  const btn = $("#btn-join-family");
  btn.disabled = true; btn.textContent = "加入中…";
  try {
    const fid = await joinFamily(code);
    const fam = await apiFetch(SUPABASE_URL + "/rest/v1/families?id=eq." + fid + "&select=*", { headers: apiHeaders(Session.token) });
    Session.saveFamily(Array.isArray(fam) ? fam[0] : fam);
    toast("已加入家族", "ok");
    await enterAlbum();
  } catch (err) {
    const m = errText(err);
    toast(/不存在|not found/i.test(m) ? "邀请码不正确，请核对" : m, "err");
  } finally { btn.disabled = false; btn.textContent = "加入"; }
});

/* ---------- 相册事件 ---------- */
$("#btn-upload").addEventListener("click", () => $("#file-input").click());
$("#file-input").addEventListener("change", (e) => { handleFiles(e.target.files); e.target.value = ""; });

let dragDepth = 0;
document.addEventListener("dragenter", (e) => {
  if (!$("#view-album").classList.contains("hidden")) { e.preventDefault(); dragDepth++; $("#drop-mask").classList.remove("hidden"); }
});
document.addEventListener("dragover", (e) => e.preventDefault());
document.addEventListener("dragleave", () => {
  dragDepth = Math.max(0, dragDepth - 1);
  if (!dragDepth) $("#drop-mask").classList.add("hidden");
});
document.addEventListener("drop", (e) => {
  e.preventDefault();
  dragDepth = 0;
  $("#drop-mask").classList.add("hidden");
  if (!$("#view-album").classList.contains("hidden") && e.dataTransfer && e.dataTransfer.files) handleFiles(e.dataTransfer.files);
});

$("#tb-invite-code").addEventListener("click", async () => {
  const fam = Session.family;
  if (!fam) return;
  try { await navigator.clipboard.writeText(fam.invite_code); toast("邀请码已复制：" + fam.invite_code, "ok"); }
  catch (_) { toast("邀请码：" + fam.invite_code, "info", 5000); }
});

/* ---------- 用户菜单 ---------- */
$("#btn-avatar").addEventListener("click", (e) => { e.stopPropagation(); $("#menu-user").classList.toggle("hidden"); });
document.addEventListener("click", (e) => { if (!e.target.closest(".menu-wrap")) $("#menu-user").classList.add("hidden"); });
$("#menu-about").addEventListener("click", () => { $("#menu-user").classList.add("hidden"); checkVersion(); $("#modal-about").classList.remove("hidden"); });
$("#btn-about-close").addEventListener("click", () => $("#modal-about").classList.add("hidden"));
$("#modal-about").addEventListener("click", (e) => { if (e.target === e.currentTarget) $("#modal-about").classList.add("hidden"); });
$("#menu-logout").addEventListener("click", () => {
  Session.clear();
  $("#menu-user").classList.add("hidden");
  showView("view-login");
  toast("已退出登录", "info");
});

/* ---------- 启动 ---------- */
$("#ver-current").textContent = APP_VERSION;
boot().catch(err => { toast("初始化失败：" + errText(err), "err"); });
</script>
</body>
</html>
